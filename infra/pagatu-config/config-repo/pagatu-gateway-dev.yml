server:
  port: 18080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18180/realms/pagatu
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: pagatu-catalogo-categorias
              uri: lb://pagatu-catalogo-ms
              predicates:
                - Path=/api/v1/categorias/**
            - id: pagatu-catalogo-productos
              uri: lb://pagatu-catalogo-ms
              predicates:
                - Path=/api/v1/productos/**
            - id: pagatu-orden-ordenes
              uri: lb://pagatu-orden-ms
              predicates:
                - Path=/api/v1/ordenes/**
            - id: pagatu-pago-pagos
              uri: lb://pagatu-pago-ms
              predicates:
                - Path=/api/v1/pagos/**
            - id: pagatu-cliente-clientes
              uri: lb://pagatu-cliente-ms
              predicates:
                - Path=/api/v1/clientes/**

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

pagatu:
  cors:
    allowed-origins: ${PAGATU_FRONTEND_ORIGIN:http://localhost:4200}
