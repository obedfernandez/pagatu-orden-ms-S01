server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://pagatu-keycloak:8080/realms/pagatu
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: pagatu-catalogo-categorias
              uri: lb://pagatu-catalogo-ms
              predicates:
                - Path=/api/v1/categorias/**
            - id: pagatu-catalogo-productos
              uri: lb://pagatu-catalogo-ms
              predicates:
                - Path=/api/v1/productos/**
            - id: pagatu-orden-ordenes
              uri: lb://pagatu-orden-ms
              predicates:
                - Path=/api/v1/ordenes/**
            - id: pagatu-pago-pagos
              uri: lb://pagatu-pago-ms
              predicates:
                - Path=/api/v1/pagos/**
            - id: pagatu-cliente-clientes
              uri: lb://pagatu-cliente-ms
              predicates:
                - Path=/api/v1/clientes/**

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: http://pagatu-eureka:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

pagatu:
  cors:
    allowed-origins: ${PAGATU_FRONTEND_ORIGIN:http://localhost:4200}
